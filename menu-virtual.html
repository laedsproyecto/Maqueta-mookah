        window.onload = async () => {
            // Detectar si se abrió escaneando una mesa específica ej: menu.html?mesa=3
            const urlParams = new URLSearchParams(window.location.search);
            const mesaNum = urlParams.get('mesa');
            if (mesaNum) {
                document.getElementById('table-number-text').innerText = `Mesa ${mesaNum}`;
                document.getElementById('table-badge').classList.remove('hidden');
            }

            await fetchBcvRate();
            await loadAgotadosFromSupabase();
            
            // Tiempo real para sincronizar si un plato se agota mientras el cliente lo mira
            supabaseClient
                .channel('public:platos_agotados')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'platos_agotados' }, () => {
                    loadAgotadosFromSupabase(true);
                })
                .subscribe();

            filterPublicCategory('all');
        };

        async function fetchBcvRate() {
            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.promedio) bcvRate = parseFloat(data.promedio);
                }
            } catch (err) {}
            document.getElementById('public-bcv-rate').innerText = `Bs. ${bcvRate.toLocaleString('es-VE', {minimumFractionDigits: 2})}`;
        }

        async function loadAgotadosFromSupabase() {
            try {
                const { data, error } = await supabaseClient.from('platos_agotados').select('item_id');
                if (!error && data) {
                    agotados86List = data.map(d => d.item_id);
                    refreshCurrentPublicView();
                }
            } catch (err) {}
        }

        function refreshCurrentPublicView() {
            const searchVal = document.getElementById('public-search').value.toLowerCase().trim();
            if (searchVal) {
                filterPublicMenu(searchVal);
            } else {
                const activeBtn = document.querySelector('button.bg-indigo-600');
                const cat = activeBtn ? activeBtn.id.replace('pcat-', '') : 'all';
                filterPublicCategory(cat);
            }
        }

        function filterPublicCategory(category) {
            const categories = ['all', 'entradas', 'rolls', 'calientes', 'pokes', 'bebidas', 'postres'];
            categories.forEach(cat => {
                const btn = document.getElementById(`pcat-${cat}`);
                if (btn) {
                    if (cat === category) {
                        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-indigo-600 text-white";
                    } else {
                        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-gray-900 text-gray-400 border border-gray-800";
                    }
                }
            });

            document.getElementById('public-search').value = '';
            renderPublicItems(category === 'all' ? menuCatalog : menuCatalog.filter(i => i.categoria === category));
        }

        function filterPublicMenu(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                filterPublicCategory('all');
                return;
            }
            const matched = menuCatalog.filter(i => 
                i.nombre.toLowerCase().includes(q) || 
                i.ingredientes.some(ing => ing.toLowerCase().includes(q)) ||
                i.categoria.toLowerCase().includes(q)
            );
            renderPublicItems(matched);
        }

        function renderPublicItems(items) {
            const container = document.getElementById('public-menu-grid');
            if (items.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 italic py-12 text-xs">No se encontraron platos.</p>`;
                return;
            }

            container.innerHTML = items.map(i => {
                const isAgotado = agotados86List.includes(i.id);
                const precioBs = i.precio * bcvRate;

                return `
                    <div class="bg-gray-900 border ${isAgotado ? 'border-red-900/50 bg-red-950/10 opacity-75' : 'border-gray-800'} rounded-xl p-3.5 flex justify-between items-center shadow-sm">
                        <div class="flex-1 pr-3">
                            <div class="flex items-center space-x-2">
                                <h3 class="font-bold text-xs ${isAgotado ? 'text-red-300 line-through' : 'text-white'}">${i.nombre}</h3>
                                ${isAgotado ? '<span class="bg-red-600 text-white text-[8px] px-1.5 py-0.5 rounded font-extrabold uppercase">Agotado</span>' : ''}
                            </div>
                            <p class="text-[10px] text-gray-400 mt-1 line-clamp-2">${i.ingredientes.join(', ')}</p>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-sm ${isAgotado ? 'text-gray-500' : 'text-indigo-400'} block">$${i.precio.toFixed(2)}</span>
                            <span class="text-[10px] text-gray-400 font-mono block">Bs. ${precioBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
