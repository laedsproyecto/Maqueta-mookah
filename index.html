<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema del Restaurante - Recepción y Meseros</title>
    <!-- Tailwind CSS CDN para diseño moderno y adaptativo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SDK Oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .mesa-disponible { background-color: #10B981; color: white; }
        .mesa-ocupada { background-color: #EF4444; color: white; }
        .mesa-por-limpiar { background-color: #F59E0B; color: white; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col">

    <!-- BARRA SUPERIOR DE NAVEGACIÓN Y CAMBIO DE ROL -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid font-bold text-xl text-indigo-400 fa-utensils"></i>
            <h1 class="text-xl font-bold tracking-wide">RestoControl POS</h1>
        </div>
        
        <!-- Selector de Rol para Probar en el Mismo Dispositivo -->
        <div class="flex space-x-2 bg-gray-900 p-1 rounded-lg border border-gray-700">
            <button id="btn-role-host" onclick="switchRole('host')" class="px-4 py-2 rounded-md font-medium text-sm transition bg-indigo-600 text-white">
                <i class="fa-solid fa-user-tie mr-2"></i>Recepción (Host)
            </button>
            <button id="btn-role-server" onclick="switchRole('server')" class="px-4 py-2 rounded-md font-medium text-sm transition text-gray-400 hover:text-white">
                <i class="fa-solid fa-concierge-bell mr-2"></i>Meseros
            </button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-1 overflow-hidden p-6">
        
        <!-- ========================================== -->
        <!-- VISTA 1: RECEPCIÓN / HOST (PLANO DE SALA) -->
        <!-- ========================================== -->
        <section id="view-host" class="h-full flex flex-col space-y-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold">Plano de Sala y Control de Mesas</h2>
                    <p class="text-gray-400 text-sm">Selecciona una mesa disponible para asignar cliente o actualizar estado.</p>
                </div>
                <div class="flex space-x-4 text-sm">
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block mr-2"></span> Disponible</span>
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-red-500 inline-block mr-2"></span> Ocupada</span>
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block mr-2"></span> Por Limpiar</span>
                </div>
            </div>

            <!-- Grilla Visual de Mesas -->
            <div id="grid-mesas-host" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 overflow-y-auto p-2">
                <!-- Se genera dinámicamente vía JS -->
            </div>
        </section>


        <!-- ========================================== -->
        <!-- VISTA 2: MESEROS (PLANO + MENÚ + COMANDA) -->
        <!-- ========================================== -->
        <section id="view-server" class="h-full hidden flex flex-col lg:flex-row gap-6">
            
            <!-- Columna Izquierda: Selección de Mesa Asignada -->
            <div class="w-full lg:w-1/4 bg-gray-800 rounded-xl p-4 border border-gray-700 flex flex-col">
                <h3 class="font-bold text-lg mb-3 flex items-center">
                    <i class="fa-solid fa-chair mr-2 text-indigo-400"></i> Seleccionar Mesa
                </h3>
                <div id="grid-mesas-server" class="grid grid-cols-2 gap-2 overflow-y-auto flex-1">
                    <!-- Se genera dinámicamente vía JS -->
                </div>
            </div>

            <!-- Columna Central: Menú Digital por Categorías -->
            <div class="w-full lg:w-2/4 bg-gray-800 rounded-xl p-4 border border-gray-700 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg" id="selected-table-title">Mesa: Ninguna Seleccionada</h3>
                    <span id="cliente-info-tag" class="text-xs bg-indigo-900 text-indigo-200 px-3 py-1 rounded-full hidden"></span>
                </div>

                <!-- Categorías -->
                <div class="flex space-x-2 overflow-x-auto pb-3 mb-3 border-b border-gray-700">
                    <button onclick="filterCategory('all')" class="px-3 py-1.5 rounded-lg text-sm bg-indigo-600 text-white whitespace-nowrap">Todos</button>
                    <button onclick="filterCategory('entradas')" class="px-3 py-1.5 rounded-lg text-sm bg-gray-700 text-gray-300 hover:bg-gray-600 whitespace-nowrap">Entradas</button>
                    <button onclick="filterCategory('sushi')" class="px-3 py-1.5 rounded-lg text-sm bg-gray-700 text-
